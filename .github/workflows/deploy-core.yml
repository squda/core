name: Build and push the scrape service

# Builds packages/core into a container image and pushes it to ECR. App Runner
# watches that repository and redeploys itself when a new image lands, so this
# is the whole deployment: push to main, and the service updates.
#
# It exists because App Runner will not build a Dockerfile from source — it only
# does that for managed runtimes — so the image has to be somewhere it can pull
# from. GitHub's runners are also amd64, which is the other half of the reason:
# an image built on an Apple Silicon laptop is arm64, and App Runner answers
# `exec format error` without mentioning architecture.

on:
  push:
    branches: [main]
    # The web app deploys itself through Vercel; nothing here needs rebuilding
    # when only its files change.
    paths:
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/deploy-core.yml'
      - 'deploy/**'
  # So a broken deploy can be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: squda-core
  # The one place that knows which box this deploys to. Replacing the instance
  # means changing this line, and nothing else.
  INSTANCE_ID: i-06b26b00943177c23

jobs:
  push:
    # ARM, to match a Graviton instance (t4g), which is around 20% cheaper than
    # the x86 equivalent for the same 2GB.
    #
    # Native rather than emulated, and that distinction is the whole reason this
    # is a runner choice instead of a `--platform` flag: QEMU-emulating an arm64
    # build on an x86 runner has to run a pnpm install and unpack a 3GB
    # Playwright image through the emulator, which takes long enough to be its
    # own problem.
    #
    # If this label is not available on the account's plan the job fails
    # immediately with "no runner matching labels" — put `ubuntu-latest` back
    # and run the service on a t3 instance instead.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - id: login
        uses: aws-actions/amazon-ecr-login@v2

      # The Dockerfile pulls the Lambda web adapter from ECR Public, and
      # anonymous pulls are capped per source IP. GitHub's runners are shared,
      # so that quota is routinely already spent by someone else:
      #
      #   429 Too Many Requests — toomanyrequests: Data limit exceeded
      #
      # Signing in moves the pull onto this account's own, far larger quota.
      # ECR Public lives only in us-east-1, whatever region the images go to.
      - name: Sign in to ECR Public
        run: |
          aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin public.ecr.aws

      - name: Build and push
        env:
          REGISTRY: ${{ steps.login.outputs.registry }}
        run: |
          # Two tags on one image: `latest` for a human pulling by hand, and the
          # commit sha for the deploy to pin to. Deploying `latest` makes two
          # builds indistinguishable afterwards, and the first question when
          # something breaks is always "which build is actually running?".
          docker build \
            -f packages/core/Dockerfile \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" \
            -t "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" \
            .
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"

      # Through SSM rather than SSH: the instance already runs the agent, the
      # credentials are the ones this workflow already has, and there is no key
      # to store, rotate, or leak. Port 22 stays shut.
      #
      # The script is sent base64-encoded because AWS-RunShellScript takes its
      # commands as a JSON array — every quote and newline in a shell script
      # would otherwise need escaping through two layers, which is a class of
      # bug with no upside.
      - name: Deploy to EC2
        env:
          REGISTRY: ${{ steps.login.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          SCRIPT=$(base64 -w0 deploy/ec2-deploy.sh)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA:0:7}" \
            --parameters "commands=[\"echo $SCRIPT | base64 -d | bash -s -- $IMAGE\"]" \
            --query 'Command.CommandId' --output text)

          echo "ssm command $COMMAND_ID"

          # `wait` returns non-zero on a failed command, and the output is worth
          # printing either way — a deploy that failed silently in a log nobody
          # opens is the reason this step exists at all.
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" && STATUS=ok || STATUS=failed

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text

          if [ "$STATUS" != ok ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query 'StandardErrorContent' --output text
            exit 1
          fi
